<text x="84" y="85" fill="#e6edf6" font-size="56" font-family="Menlo,Consolas,Liberation Mono,monospace" font-weight="bold">sbar</text>
<text x="264" y="67" fill="#e6edf6" font-size="32" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Live stats. Same terminal.</text>
<text x="264" y="99" fill="#8190a7" font-size="18" font-family="Helvetica,Arial,sans-serif" >CPU, RAM, GPU, disk and network — right under your shell.</text>
